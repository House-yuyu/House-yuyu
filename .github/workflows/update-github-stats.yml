name: Update GitHub stats card daily

on:
  schedule:
    - cron: "13 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Fetch fresh GitHub stats and render SVG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-github-stats.cjs
      - name: Commit daily card refresh
        run: |
          if git diff --quiet -- assets/github-stats.svg README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg README.md
          git commit -m "Update daily profile GitHub stats"
          git push
