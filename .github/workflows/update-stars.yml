name: Refresh profile project stars

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-stars:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README star totals from GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const account = 'House-yuyu';
            const ownRepos = await github.paginate(github.rest.repos.listForUser, {
              username: account,
              type: 'owner',
              per_page: 100
            });
            const ownedStars = ownRepos
              .filter(repo => repo.owner.login.toLowerCase() === account.toLowerCase() && !repo.private)
              .reduce((sum, repo) => sum + repo.stargazers_count, 0);
            const { data: collection } = await github.rest.repos.get({
              owner: 'leonmakise',
              repo: 'Awesome-All-in-one-Image-Restoration-Methods'
            });
            const sharedStars = collection.stargazers_count;
            const totalStars = ownedStars + sharedStars;

            const startMarker = '<!-- STARS:START -->';
            const endMarker = '<!-- STARS:END -->';
            const file = 'README.md';
            const original = fs.readFileSync(file, 'utf8');
            const begin = original.indexOf(startMarker);
            const end = original.indexOf(endMarker);
            if (begin < 0 || end < begin) {
              throw new Error('Cannot find Star count markers in README.md');
            }
            const line = '⭐ **Total project Stars: ' + totalStars + '** — ' +
              '[House-yuyu](https://github.com/House-yuyu?tab=repositories): **' + ownedStars + '** + ' +
              '[Awesome All-in-One Image Restoration](https://github.com/leonmakise/Awesome-All-in-one-Image-Restoration-Methods) ' +
              '(co-maintained): **' + sharedStars + '**.';
            const updated = original.slice(0, begin + startMarker.length) +
              '\n' + line + '\n' + original.slice(end);
            if (updated !== original) fs.writeFileSync(file, updated);
            core.info('Total project stars: ' + totalStars);

      - name: Commit only when the numbers change
        run: |
          if git diff --quiet -- README.md; then
            echo "Star counts have not changed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Refresh profile star counts"
          git push
